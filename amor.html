<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>San Valentín para Mónica</title>
    <style>
        body {
            background-color: #ffdde1;
            text-align: center;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            width: 80%;
            max-width: 500px;
        }
        h1 {
            color: #ff4081;
        }
        .buttons {
            margin-top: 20px;
        }
        .btn {
            padding: 10px 20px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 5px;
        }
        .next {
            background-color: #ff4081;
            color: white;
        }
        .hearts {
            position: absolute;
            width: 100%;
            height: 100vh;
            pointer-events: none;
        }
        .heart {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: red;
            clip-path: polygon(50% 0%, 100% 35%, 80% 100%, 50% 80%, 20% 100%, 0% 35%);
            animation: float 5s linear infinite;
        }
        @keyframes float {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100vh) scale(0.5); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="hearts"></div>
    <div class="container" id="screen">
        <h1 id="message">Amorcito gracias por ser lo mejor de mi vida un año más</h1>
        <button class="btn next" onclick="nextScreen()">Siguiente</button>
    </div>

    <script>
        let screenIndex = 0;
        const messages = [
            "Amorcito gracias por ser lo mejor de mi vida un año más",
            "Gracias por estar en cada uno de los momentos",
            "Gracias por todos esos besos, abrazos, esos te quiero, por el apoyo que siempre me has dado. Y por solo ser mi angelito",
            "Gracias también por esas culeeeeeaaaa, estás más BUENA que quién sabe qué, y no tienes idea las ganas que te tengo en este momento.",
            "Por eso quisiera saber si...",
            "¿Quieres ser mi Valentine, Amorcito? ❤️"
        ];

        function nextScreen() {
            screenIndex++;
            if (screenIndex < messages.length) {
                document.getElementById("message").innerText = messages[screenIndex];
                if (screenIndex === messages.length - 1) {
                    document.querySelector(".btn.next").style.display = "none";
                    document.getElementById("screen").innerHTML += `
                        <div class='buttons'>
                            <button class='btn yes' onclick='showMessage()'>Sí</button>
                            <button class='btn no' onclick='showMessage()'>Si porque no tienes opcion</button>
                        </div>
                        <div id='finalMessage' class='message' style='display: none;'>¡Sabía que dirías que sí! ❤️🥰</div>`;
                }
            }
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            document.querySelector('.hearts').appendChild(heart);
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 2 + 3 + 's';
            setTimeout(() => heart.remove(), 5000);
        }
        setInterval(createHeart, 300);

        function showMessage() {
            document.getElementById('finalMessage').style.display = 'block';
        }
    </script>
</body>
</html>
